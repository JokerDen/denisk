<div class="studio-logo-list" aria-label="{% if include.hide_dk %}Studios{% else %}Independent work and studios{% endif %}">
  {% unless include.hide_dk %}
  <div class="company-logo company-logo-image company-logo-dark" title="DenisK Interactive">
    <img src="{{ '/assets/logo.png' | relative_url }}" alt="DK">
  </div>
  {% endunless %}
  <div class="company-logo company-logo-image company-logo-dark" title="Voodoo">
    <img src="{{ '/assets/portfolio/voodooio_logo.jpeg' | relative_url }}" alt="Voodoo">
  </div>
  <div class="company-logo company-logo-image company-logo-full" title="Fun-To-Mass">
    <img src="{{ '/assets/portfolio/company-funtomass.png' | relative_url }}" alt="Fun-To-Mass">
  </div>
  <div class="company-logo company-logo-image" title="iLogos">
    <img src="{{ '/assets/portfolio/ilogos_logo.jpeg' | relative_url }}" alt="iLogos">
  </div>
  <div class="company-logo company-logo-image company-logo-dark" title="Saber Interactive">
    <img src="{{ '/assets/portfolio/company-saber.png' | relative_url }}" alt="Saber Interactive">
  </div>
  <span class="company-logo company-logo-more" role="img" aria-label="Other studios" title="Other studios">…</span>
</div>
