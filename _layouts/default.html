<!doctype html>
<html lang="{{ site.lang | default: 'en' }}"{% if page.url == '/' %} class="is-homepage"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" type="image/png" href="{{ '/assets/logo.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% if page.url == '/' %}
    <script src="{{ '/assets/js/site-header.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/portfolio-video.js' | relative_url }}" defer></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="page">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Denis Kazantsev, DenisK Interactive">
          <img class="site-logo" src="{{ '/assets/logo.png' | relative_url }}" width="42" height="42" alt="" aria-hidden="true">
          <span class="site-brand-text">
            <span class="site-title">Denis Kazantsev</span>
            <span class="site-subtitle">DenisK Interactive</span>
          </span>
        </a>
        {% if page.article %}
        <nav aria-label="Article navigation">
          <a class="header-button" href="{{ '/' | relative_url }}"><span aria-hidden="true">&larr;</span> Back to portfolio</a>
          <a class="header-button" href="{{ '/' | relative_url }}#contact"><span>Contact</span></a>
        </nav>
        {% else %}
        <nav aria-label="Main navigation">
          <a class="header-button" href="#portfolio" data-label="Portfolio"><span>Portfolio</span></a>
          <a class="header-button" href="#contact" data-label="Contact"><span>Contact</span></a>
        </nav>
        {% endif %}
      </div>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p class="page">Denis Kazantsev · DenisK Interactive · Senior Game Developer · Netherlands · 2026</p>
    </footer>
  </body>
</html>
